name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphrag-poc
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphrag-poc 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: graphrag-poc
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the service image
        run: docker build -t graphrag-poc .
