[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-poc"
version = "0.1.0"
description = "Graph RAG proof of concept. Milestone 1 is the hybrid-retrieval baseline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.6",
    "openai>=1.60",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pydantic>=2.10",
    "qdrant-client>=1.19,<1.20",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphrag_poc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src/graphrag_poc/models",
    "src/graphrag_poc/ingest",
    "src/graphrag_poc/cases",
    "src/graphrag_poc/index",
    "src/graphrag_poc/retrieve",
    "src/graphrag_poc/generate",
    "src/graphrag_poc/app",
]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "fastembed",
    "fastembed.*",
    "openai",
    "openai.*",
    "qdrant_client",
    "qdrant_client.*",
    "uvicorn",
    "uvicorn.*",
]
ignore_missing_imports = true
